version: 1

frontend:
  phases:
    preBuild:
      commands:
        # Keep the build independent from Amplify image runtime changes.
        - nvm install 22
        - nvm use 22
        - npm --prefix frontend ci

    build:
      commands:
        - npm --prefix frontend run build

  artifacts:
    # Paths are relative to the repository root in this single-app build spec.
    baseDirectory: frontend/dist/frontend/browser
    files:
      - '**/*'

  cache:
    paths:
      - ~/.npm/**/*
