spring:
  application:
    name: costestimator
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "mail.smtp.auth": ${SMTP_AUTH:false}
      "mail.smtp.starttls.enable": ${SMTP_STARTTLS:false}
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  security:
    enabled: true
  mail:
    delivery-enabled: ${MAIL_DELIVERY_ENABLED:false}
    from: ${MAIL_FROM:no-reply@costestimator.local}
    verification-base-url: ${APP_PUBLIC_URL:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:${MAIL_DELIVERY_ENABLED:false}}
