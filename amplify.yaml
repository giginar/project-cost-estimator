version: 1

applications:
  - appRoot: frontend

    frontend:
      phases:
        preBuild:
          commands:
            # Angular 21 requires a recent Node.js release. Pin it so Amplify
            # image updates do not unexpectedly change the build runtime.
            - nvm install 22
            - nvm use 22
            - npm ci

        build:
          commands:
            - npm run build

      artifacts:
        baseDirectory: dist/frontend/browser
        files:
          - '**/*'

      cache:
        paths:
          - ~/.npm/**/*
